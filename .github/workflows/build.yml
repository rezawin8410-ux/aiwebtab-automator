name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        id: build
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > /tmp/build.out 2>&1
          EXIT_CODE=$?
          echo "BUILD_EXIT_CODE=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error title=Build Failed::Gradle build failed with exit code $EXIT_CODE"
            echo "Last 50 lines of build output:"
            tail -50 /tmp/build.out
          fi
          cat /tmp/build.out
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.out
          retention-days: 7

      - name: Upload APK
        if: steps.build.outputs.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: AIWebTabAutomator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: steps.build.outputs.BUILD_EXIT_CODE == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: app/build/outputs/apk/debug/app-debug.apk
          name: AIWebTabAutomator v1.0.0
          generate_release_notes: true
