name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          ANDROID_SDK="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK"
          
          # Download cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK"
          
          # cmdline-tools zip extracts to cmdline-tools/cmdline-tools/, move latest inside
          if [ -d "$ANDROID_SDK/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_SDK/cmdline-tools/cmdline-tools" "$ANDROID_SDK/cmdline-tools/latest"
          else
            mv "$ANDROID_SDK/cmdline-tools" "$ANDROID_SDK/cmdline-tools/latest"
          fi
          
          export PATH="$ANDROID_SDK/cmdline-tools/latest/bin:$PATH"
          export ANDROID_HOME="$ANDROID_SDK"
          export ANDROID_SDK_ROOT="$ANDROID_SDK"
          
          # Accept licenses and install platforms
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
